[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-lab"
version = "0.4.0"
description = "PyTorch adversarial robustness, detection and evaluation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "torchvision>=0.21", "numpy>=1.26", "Pillow>=10", "pydantic>=2", "scikit-learn>=1.4"]

[project.optional-dependencies]
attacks = ["foolbox==3.3.4", "eagerpy==0.30.0", "scipy>=1.10,<2", "autoattack @ https://github.com/fra31/auto-attack/archive/a39220048b3c9f2cca9a4d3a54604793c68eca7e.zip"]
workbench = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32"]

[project.scripts]
aegis = "aegis_lab.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_lab*"]

[tool.setuptools.package-data]
aegis_lab = ["configs/*.json"]
